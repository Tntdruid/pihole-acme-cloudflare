<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">pihole-acme-cloudflare</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="hole" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.7" stop-color="#020617"/>
      <stop offset="1" stop-color="#1e293b"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- cloud behind the lock -->
  <path fill="url(#cloud)" d="M58 150 a34 34 0 0 1 8-66 a46 46 0 0 1 86-14 a38 38 0 0 1 52 34 a26 26 0 0 1-2 46 Z"/>

  <!-- shackle -->
  <path d="M100 132 V108 a28 28 0 0 1 56 0 V132" fill="none" stroke="#e2e8f0" stroke-width="15" stroke-linecap="round"/>

  <!-- lock body -->
  <rect x="78" y="124" width="100" height="88" rx="18" fill="url(#lock)"/>
  <rect x="78" y="124" width="100" height="88" rx="18" fill="none" stroke="#0b1120" stroke-opacity=".25" stroke-width="3"/>

  <!-- the "hole" where the keyhole would be: blocked traffic falls in -->
  <circle cx="128" cy="166" r="24" fill="#bbf7d0" fill-opacity=".35"/>
  <circle cx="128" cy="166" r="19" fill="url(#hole)"/>

  <!-- ACME check mark badge -->
  <circle cx="186" cy="198" r="26" fill="#0b1120"/>
  <circle cx="186" cy="198" r="21" fill="#f8fafc"/>
  <path d="M175 198 l8 8 l15 -16" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
